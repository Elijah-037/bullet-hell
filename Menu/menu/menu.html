<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Pixel Art</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>
    <div id="menu-container">
        <div class="title">
            <h1><img src="image/menu.png" alt="Menu" /></h1>
        </div>
        
        <div class="menu-options">
            <div class="selectable" id="playDiv">
                <img src="image/play.png" alt="Play" />
            </div>
            
            <div class="selectable" id="continueDiv">
                <img src="image/continue.png" alt="Continue" />
            </div>
            
            <div class="selectable" id="creditsDiv">
                <img src="image/credits.png" alt="Credits" />
            </div>
            
            <div class="selectable" id="optionDiv">
                <img src="image/options.png" alt="Option" />
            </div>
            
            <div class="selectable" id="exitDiv">
                <img src="image/exit.png" alt="Exit" />
            </div>
            
            <!-- Flèche de sélection -->
            <img src="image/flèche.png" id="arrow" class="arrow" />
        </div>
    </div>
    
    <script src="menu.js"></script>
</body>
</html>
